# Manual only. Runs main.py evaluate with the GEMINI_API_KEY secret and commits eval/ back to main.
{"name": "Run evaluation", "on": {"workflow_dispatch": null}, "permissions": {"contents": "write"}, "jobs": {"evaluate": {"runs-on": "ubuntu-latest", "timeout-minutes": 90, "env": {"GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"}, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "astral-sh/setup-uv@v5"}, {"run": "uv sync"}, {"run": "GEMINI_MODEL=gemini-3.5-flash-lite uv run python main.py evaluate"}, {"if": "always()", "run": "git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add eval/ && (git commit -m 'Evaluation results (GitHub Actions)' || echo nothing to commit) && git pull --rebase --autostash && git push"}]}}}
